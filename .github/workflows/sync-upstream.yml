name: 自动同步上游NodeWarden源码
# 权限：必须开启写入权限，才能推送更新到你的仓库
permissions:
  contents: write
on:
  # 定时：每日凌晨3点自动同步（和原文档推荐时间一致）
  schedule:
    - cron: "0 3 * * *"
  # 支持网页手动一键触发更新
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前仓库代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 同步上游官方main分支
        uses: aormsby/Fork-Sync-With-Upstream-action@v3
        with:
          # 上游源仓库地址
          upstream_repository: shuaiplus/nodewarden
          # 上游同步分支
          upstream_branch: main
          # 你自己仓库需要同步的分支
          target_branch: main
          # 内置令牌无需手动配置
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          # 只快进合并，不产生多余合并提交，避免冲突
          sync_mode: fast-forward-only
          test_mode: false
