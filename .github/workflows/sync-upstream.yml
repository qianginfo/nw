name: 原生Git同步NodeWarden上游
permissions:
  contents: write
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取完整仓库代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 配置Git身份并同步上游仓库
        run: |
          git config --global user.name "AutoSync Bot"
          git config --global user.email "autosync@github.com"
          git remote remove upstream || true
          git remote add upstream https://github.com/shuaiplus/nodewarden.git
          git fetch upstream main
          # 仅快进合并，无冲突才同步，冲突直接终止，不会覆盖自定义修改
          git merge --ff-only upstream/main
          git push origin main
